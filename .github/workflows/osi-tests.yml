name: OSI tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  posix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: [SYSTEM, SOURCE]
        sanitizer: [NONE, ADDRESS]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc g++ python3 python3-venv libcmocka-dev
      - name: Prepare configuration tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install kconfiglib==14.1.0
          echo "EMBT_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Prepare pinned cmocka
        if: matrix.provider == 'SOURCE'
        run: python3 tools/dependencies/prepare_cmocka.py
      - name: Build and run OSI tests
        run: >-
          ./mkbt.sh test --build-dir build/osi-ci
          --cmake-arg -DEMBT_CMOCKA_PROVIDER=${{ matrix.provider }}
          --cmake-arg -DEMBT_OSI_SANITIZER=${{ matrix.sanitizer }}
      - name: Repeat concurrency and lifetime tests
        run: >-
          ctest --test-dir build/osi-ci
          -R 'osi[.](sem|mutex|cond|thread|timer)[.]'
          --repeat until-fail:20 --output-on-failure --no-tests=error
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osi-${{ matrix.provider }}-${{ matrix.sanitizer }}
          path: |
            build/osi-ci/osi-results.xml
            build/osi-ci/osi-test-manifest.json
            build/osi-ci/Testing/
            build/osi-ci/.config
            build/osi-ci/compile_commands.json
            build/osi-ci/CMakeCache.txt
